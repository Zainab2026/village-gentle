services:
  - type: web
    name: village-gentle
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run main1.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: WINDY_API_KEY
        sync: false
      - key: KINDWISE_API_KEY
        sync: false
      - key: NUTRITIONIX_APP_ID
        sync: false
      - key: NUTRITIONIX_APP_KEY
        sync: false
      - key: HF_TOKEN
        sync: false